<!DOCTYPE html>
<html lang="ru" ng-app="catchTheBallApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Улови мяч</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.6.9/angular.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body ng-controller="GameController as gameCtrl" class="d-flex flex-column">
    <div class="container text-center">
        <canvas id="gameCanvas" width="800" height="600" class="border"></canvas>
    </div>
    <button id="startButton" class="btn btn-primary mt-3" ng-click="gameCtrl.startGame()">Начать игру</button>
    <script src="app.js"></script>
</body>
</html>
