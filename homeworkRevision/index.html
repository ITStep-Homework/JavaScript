<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Домашнее задание</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="container my-5">
    <h1 class="text-center mb-5">Домашнее задание</h1>

    <!-- Задание 1 -->
    <section class="mb-5">
        <h2>Тест</h2>
        <form id="testForm" class="mb-3">
            <div class="mb-3">
                <p>Вопрос 1: Какой цвет неба?</p>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="q1" value="0" id="q1a">
                    <label class="form-check-label" for="q1a">Красный</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="q1" value="1" id="q1b">
                    <label class="form-check-label" for="q1b">Синий</label>
                </div>
            </div>
            <div class="mb-3">
                <p>Вопрос 2: Сколько ног у кошки?</p>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="q2" value="1" id="q2a">
                    <label class="form-check-label" for="q2a">Четыре</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="q2" value="0" id="q2b">
                    <label class="form-check-label" for="q2b">Две</label>
                </div>
            </div>
            <button type="button" class="btn btn-primary" onclick="checkAnswers()">Проверить ответы</button>
        </form>
        <p id="result" class="fw-bold"></p>
    </section>

    <!-- Задание 2 -->
    <section class="mb-5">
        <h2>Изменение числа</h2>
        <div class="input-group">
            <button class="btn btn-outline-secondary" onclick="decrease()">-</button>
            <input type="text" id="numberInput" class="form-control text-center" value="0" readonly>
            <button class="btn btn-outline-secondary" onclick="increase()">+</button>
        </div>
    </section>

    <!-- Задание 3 -->
    <section class="mb-5">
        <h2>Изменение цвета текста</h2>
        <p id="text" class="mb-3">Это текст, который будет менять цвет.</p>
        <div>
            <button class="btn btn-danger" onclick="changeColor('red')">Красный</button>
            <button class="btn btn-success" onclick="changeColor('green')">Зелёный</button>
            <button class="btn btn-primary" onclick="changeColor('blue')">Синий</button>
        </div>
    </section>

    <!-- Задание 4 -->
    <section>
        <h2>Комментарии</h2>
        <article class="mb-3">
            <h3>Статья</h3>
            <p>Это текст статьи.</p>
        </article>
        <section id="comments" class="mb-3">
            <h4>Комментарии</h4>
            <div id="commentsList" class="list-group"></div>
        </section>
        <section>
            <h4>Добавить комментарий</h4>
            <form id="commentForm" class="mb-3">
                <div class="mb-3">
                    <input type="text" id="username" class="form-control" placeholder="Ваше имя" required>
                </div>
                <div class="mb-3">
                    <textarea id="commentText" class="form-control" placeholder="Ваш комментарий" required></textarea>
                </div>
                <button type="button" class="btn btn-primary" onclick="addComment()">Добавить комментарий</button>
            </form>
        </section>
    </section>

    <script src="app.js"></script>
</body>
</html>
